# /etc/nginx/conf.d/money-ratelimit.conf
# money : limite uniquement les ENVOIS du formulaire de connexion (POST /login), 10/min par IP.
# Les simples affichages de la page (GET) ne comptent pas, pour ne jamais bannir un usage normal.
map $request_method $money_login_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $money_login_key zone=money_login_post:10m rate=10r/m;
